name: Publish to crates.io

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # A tag push does not run the CI workflow, which triggers on branches
      # only. Repeat its gates here so a release cannot skip them.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # The broker-backed tests in `tests/delivery.rs` carry `#[ignore]`, so
      # the run above skips them. They hold the only proof that a birth names
      # the edge node of the connect call on a real bus, so CI must run them.
      #
      # Mosquitto 2 refuses an anonymous client until a config file allows
      # one. A `services:` block starts a container before any step can write
      # that file, so this step starts the broker itself.
      - name: Start an MQTT broker
        run: |
          docker run -d --rm --name sparkplug-publish-broker -p 1883:1883 eclipse-mosquitto:2 \
            sh -c 'printf "listener 1883\nallow_anonymous true\n" > /m.conf && mosquitto -c /m.conf'
          for _ in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "the broker accepts connections"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the broker did not open port 1883 within 30 s" >&2
          docker logs sparkplug-publish-broker
          exit 1

      - run: cargo test -- --ignored

      - name: Stop the MQTT broker
        if: always()
        run: docker stop sparkplug-publish-broker

      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "publishing $crate"

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
